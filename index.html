<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODROG Course | Premium Learning</title>
    <style>
        /* 25. Suggested GODROG color system */
        :root {
            --primary: #6C5CE7;
            --secondary: #00D4FF;
            --accent: #A855F7;
            --bg-color: #070B1A;
            --glass-bg: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #FFFFFF;
            --text-muted: #A7B0C5;
            --success: #22C55E;
            --error: #FF5C7A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* 2. Background Animation (Aurora) */
        .aurora-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            filter: blur(60px);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: moveBlob 20s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 500px; height: 500px;
            background: var(--primary);
            top: -100px; left: -100px;
        }

        .blob-2 {
            width: 400px; height: 400px;
            background: var(--secondary);
            bottom: -50px; right: -50px;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 600px; height: 600px;
            background: var(--accent);
            top: 40%; left: 30%;
            animation-delay: -10s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 100px) scale(1.2); }
        }

        /* 3. Particle Animation (GODROG letters) */
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            color: rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-size: 14px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* 5. Main Login Card (Glassmorphism) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            opacity: 0;
            animation: pageEntrance 1s ease-out 0.6s forwards;
            margin: 20px;
        }

        @keyframes pageEntrance {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 6. GODROG Logo & 7. Heading */
        .card-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 4s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); text-shadow: 0 10px 20px rgba(0,212,255,0.3); }
        }

        .welcome-text {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 8 & 9. Input Fields with Floating Labels */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            background: var(--bg-color);
            padding: 0 5px;
            border-radius: 4px;
            color: var(--secondary);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
        }

        .input-icon:hover {
            color: var(--text-main);
        }

        /* 11. Options (Remember / Forgot) */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 30px;
            color: var(--text-muted);
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--secondary);
            text-decoration: none;
            transition: text-shadow 0.3s;
        }

        .forgot-link:hover {
            text-shadow: 0 0 8px rgba(0,212,255,0.5);
        }

        /* 12. Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            background-size: 200% auto;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--glass-border);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .btn-google {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .signup-text a {
            color: var(--text-main);
            font-weight: 600;
            text-decoration: none;
        }

        /* 10. Error Animation */
        .shake {
            animation: horizontalShake 0.3s ease-in-out;
        }

        @keyframes horizontalShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* 13. Loading/Success States */
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Responsive Mobile UI */
        @media (max-width: 480px) {
            .glass-card {
                width: 92%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 2. Aurora Background -->
    <div class="aurora-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 3. GODROG Particles -->
    <div id="particles"></div>

    <!-- 5. Main Login Card -->
    <div class="glass-card" id="loginCard">
        
        <div class="card-header">
            <div class="logo">✦ GODROG ✦</div>
            <h2 class="welcome-text">Welcome Back 👋</h2>
            <p class="subtitle">Continue your learning journey</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="off">
                <label for="email">Email / Username</label>
                <span class="input-icon">✉</span>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
                <span class="input-icon" id="togglePassword" onclick="togglePass()">👁</span>
            </div>

            <div class="options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">SIGN IN</span>
            </button>

        </form>

        <div class="divider">OR</div>

        <button class="btn btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <div class="signup-text">
            Don't have an account? <a href="#">Create Account</a>
        </div>

    </div>

    <script>
        // 4. Mouse Interaction (Subtle 3D Parallax)
        const card = document.getElementById('loginCard');
        
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            // Kept subtle as requested (1-3 degrees)
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset transform on mouse leave
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // 3. GODROG Particles Generation
        const letters = ['G', 'O', 'D', 'R', 'O', 'G', '•', '✦'];
        const particlesContainer = document.getElementById('particles');
        
        for(let i = 0; i < 30; i++) {
            let particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerText = letters[Math.floor(Math.random() * letters.length)];
            
            // Randomize position, animation duration, and delay
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
            particle.style.animationDelay = `${Math.random() * 10}s`;
            
            particlesContainer.appendChild(particle);
        }

        // 9. Password Toggle
        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.innerText = '🔒';
            } else {
                passInput.type = 'password';
                toggleIcon.innerText = '👁';
            }
        }

        // 13 & 10. Login Simulation (Loading, Success, Error Shake)
        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const form = document.getElementById('loginForm');
            
            // Stage 1: Loading
            btnText.innerText = 'Signing in...';
            spinner.style.display = 'block';
            btn.style.pointerEvents = 'none';

            // Simulate Network Request
            setTimeout(() => {
                const emailVal = document.getElementById('email').value;
                
                // Simulate an error if email is "error@godrog.com"
                if(emailVal === 'error@godrog.com') {
                    // Stage 2: Error
                    btnText.innerText = 'SIGN IN';
                    spinner.style.display = 'none';
                    btn.style.pointerEvents = 'auto';
                    card.classList.add('shake');
                    setTimeout(() => card.classList.remove('shake'), 300);
                } else {
                    // Stage 3: Success Animation
                    btn.style.background = 'var(--success)';
                    btnText.innerText = '✓ Login Successful';
                    spinner.style.display = 'none';
                    card.style.transform = 'scale(1.03)';
                    
                    // Stage 4: Redirect Simulation
                    setTimeout(() => {
                        card.style.opacity = '0';
                        setTimeout(() => alert('Redirecting to GODROG Student Dashboard...'), 300);
                    }, 1000);
                }
            }, 1500);
        }
    </script>
</body>
</html>
